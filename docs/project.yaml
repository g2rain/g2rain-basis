schemaVersion: 1
name: g2rain-basis
family: backend-foundation-service
role: 平台核心主数据与权限治理服务
language: Java
buildTool: Maven

architectureBaseline:
  repository: https://github.com/g2rain/g2rain
  ref: architecture-v1.0.0
  profile: docs/architecture/profiles/java-domain-service
  version: 1.0.0
  status: planned
  releasedAt: "2026-08-24"
  deviations: docs/architecture/deviations.md

ownership:
  owns:
    - 组织、用户、通行证与租户开通主数据
    - 应用、资源、角色与功能权限关系
    - 外部身份提供方绑定、企业映射与企业应用授权
    - 权限聚合、服务注册和审计事件持久化
  excludes:
    - OAuth/OIDC 页面、授权码和令牌签发
    - 网关路由、统一入口鉴权和请求转发
    - 部门数据权限模型
    - 管理端前端页面

modules:
  - name: g2rain-basis-api
    path: g2rain-basis-api
    role: 领域契约
    mayDependOn: []
  - name: g2rain-basis-biz
    path: g2rain-basis-biz
    role: 领域实现
    mayDependOn:
      - g2rain-basis-api
  - name: g2rain-basis-startup
    path: g2rain-basis-startup
    role: 运行时组装
    mayDependOn:
      - g2rain-basis-biz

runtime:
  mainClass: com.g2rain.basis.Application
  defaultPort: 8080
  defaultProfile: dev
  minimumVersions:
    java: "25"
    mysql: "8.0.13"
  dependencies:
    - MySQL
    - Redis
    - Nacos
    - Kafka

commands:
  verify: mvn clean verify
  run: mvn -pl g2rain-basis-startup -am spring-boot:run
  codegen: mvn g2rain-crafter:bootstrap
  image: ./build.sh <tag>

validation:
  lastVerifiedAt: "2026-09-03"
  command: mvn clean verify
  result: passed
  testsRun: 64
  testClasses: 12
  note: 当前以 Service 和领域工具单元测试为主；数据库、Controller、跨服务与 Startup 集成覆盖仍待补充

community:
  website: https://www.g2rain.com
  issues: https://github.com/g2rain/g2rain/issues
  discussions: https://github.com/g2rain/g2rain/discussions
  email: g2rain_developer@163.com
  license:
    name: Apache License 2.0
    file: LICENSE
    url: https://github.com/g2rain/g2rain-basis/blob/main/LICENSE
  contributionNotice: 代码贡献前请尽量补充必要的测试和文档，并确保构建、测试与静态检查通过。
  acknowledgement: 感谢所有为 g2rain 项目提交 Issue、代码、文档、建议和使用反馈的开发者们！

architectureRules:
  - g2rain-basis-api 不得依赖 g2rain-basis-biz 或 g2rain-basis-startup
  - g2rain-basis-biz 必须依赖 g2rain-basis-api 且不得依赖 g2rain-basis-startup
  - g2rain-basis-startup 负责组装 g2rain-basis-biz
  - API 模块不得引用 controller、service、dao、config 等实现包
  - 前端 App 通过 g2rain-iam 完成认证并取得用于 Gateway 的 Token
  - 前端 App 携带 Token 通过 Gateway 访问平台服务
  - 前端 App 和普通外部调用方必须通过 Gateway 访问 Basis
  - g2rain-iam 可以直连 Basis 明确开放的部分受信内部接口
  - Basis 与 Department 之间允许按内部服务契约直接调用
  - 受信内部接口必须显式隐藏，不得只依赖 URL 前缀隔离
  - 同步写契约必须登记调用方、服务身份、权限、事务、幂等、重试、兼容和补偿
  - WithoutIsolation 路径必须由受信 Service 显式补足组织范围校验
  - 逻辑删除唯一键必须明确删除后释放或永久占位语义

documentation:
  entry: docs/index.md
  architecture: docs/architecture/overview.md
  decisions: docs/decisions
  agentEntry: AGENTS.md
  required:
    - docs/requirements/README.md
    - docs/community.md
    - docs/architecture/overview.md
    - docs/architecture/modules.md
    - docs/architecture/dependencies.md
    - docs/architecture/runtime-flows.md
    - docs/architecture/deviations.md
    - docs/development/local-development.md
    - docs/development/code-conventions.md
    - docs/development/api-conventions.md
    - docs/development/database-conventions.md
    - docs/development/testing.md
    - docs/development/definition-of-done.md
    - docs/development/code-generation.md
    - docs/operations/configuration.md
    - docs/operations/deployment.md
    - docs/operations/observability.md
    - docs/operations/troubleshooting.md
    - docs/security/security-boundaries.md

aiCoding:
  instructionEntry: AGENTS.md
  requirementTemplate: docs/requirements/README.md
  validation:
    - 检查需求、中央 Profile、项目差异、源码、配置、数据库、测试和 Git Diff
    - 执行 mvn clean verify
    - 动态检查文档链接与元数据一致性
    - 报告未验证事项和剩余风险
