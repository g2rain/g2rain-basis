name: Publish API to GitHub Maven Packages
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: maven-api-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
      - name: Configure GitHub Maven repositories and publishing server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          settings_path="$RUNNER_TEMP/g2rain-maven-settings.xml"
          python3 - "$settings_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.Element('settings', xmlns='http://maven.apache.org/SETTINGS/1.0.0')
          servers = ET.SubElement(root, 'servers')
          profile = ET.SubElement(ET.SubElement(root, 'profiles'), 'profile')
          ET.SubElement(profile, 'id').text = 'g2rain-packages'
          repositories = ET.SubElement(profile, 'repositories')
          plugin_repositories = ET.SubElement(profile, 'pluginRepositories')
          names = ('g2rain-common', 'g2rain-spring-boot-starter', 'g2rain-department',
                   'g2rain-mybatis-extensions', 'g2rain-crafter', 'g2rain-generator-maven-plugin')
          for name in (*names, 'github'):
              server = ET.SubElement(servers, 'server')
              ET.SubElement(server, 'id').text = name
              ET.SubElement(server, 'username').text = '${env.GITHUB_ACTOR}'
              ET.SubElement(server, 'password').text = '${env.GITHUB_TOKEN}'
          for name in names:
              for parent, kind in ((repositories, 'repository'), (plugin_repositories, 'pluginRepository')):
                  repository = ET.SubElement(parent, kind)
                  ET.SubElement(repository, 'id').text = name
                  ET.SubElement(repository, 'url').text = 'https://maven.pkg.github.com/g2rain/' + name
                  ET.SubElement(ET.SubElement(repository, 'snapshots'), 'enabled').text = 'false'
          ET.SubElement(ET.SubElement(root, 'activeProfiles'), 'activeProfile').text = 'g2rain-packages'
          ET.ElementTree(root).write(sys.argv[1], encoding='utf-8', xml_declaration=True)
          PY
          chmod 600 "$settings_path"
          echo "MAVEN_SETTINGS=$settings_path" >> "$GITHUB_ENV"
          echo 'Configured authenticated G2rain Maven dependencies and github deploy server.'
      - name: Require release branch commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Selected commit is outside main' >&2; exit 1; }
      - name: Build, test and publish parent POM and API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -U
          -pl g2rain-basis-api -am clean deploy
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/g2rain/g2rain-basis
